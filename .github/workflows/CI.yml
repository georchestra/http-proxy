# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+*'
    tags:
      - '*'

jobs:
  # Run build and test
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Getting image tag
      id: version
      run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn -B clean install

    - name: Build docker image
      run: docker build -t georchestra/http-proxy:latest .

    - name: "Log in to docker.io"
      if: github.repository == 'georchestra/http-proxy'
      uses: docker/login-action@v3
      with:
        username: '${{ secrets.DOCKER_HUB_USERNAME }}'
        password: '${{ secrets.DOCKER_HUB_PASSWORD }}'

    - name: Push frontend
      if: github.repository == 'georchestra/http-proxy'
      run: docker push georchestra/http-proxy:latest

    - name: Push release
      if: github.repository == 'georchestra/http-proxy' && endsWith(github.ref, '.x') || github.ref_type == 'tag'
      run: |
        docker tag georchestra/http-proxy:latest georchestra/http-proxy:${{ steps.version.outputs.VERSION }}
        docker push georchestra/http-proxy:${{ steps.version.outputs.VERSION }}
